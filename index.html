<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandelbrot & Julia Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="panel">
        <h1>Mandelbrot Explorer</h1>

        <div class="control-group">
            <label for="select-preset">Cool Places</label>
            <select id="select-preset">
                <option value="default">Default View</option>
                <option value="seahorse">Seahorse Valley</option>
                <option value="spiral">Deep Spiral</option>
                <option value="minibrot">Mini Mandelbrot</option>
                <option value="elephant">Elephant Valley</option>
                <option value="rabbit">Douady's Rabbit (Julia)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="slider-iter">
                <span>Iterations</span>
                <span id="label-iter">350</span>
            </label>
            <input type="range" id="slider-iter" min="60" max="2500" step="20" value="350">
        </div>

        <div class="control-group">
            <label for="select-palette">Palette</label>
            <select id="select-palette">
                <option value="0">Electric Blue</option>
                <option value="1">Fire &amp; Ember</option>
                <option value="2">Acid Green</option>
                <option value="3">Psychedelic Rainbow</option>
                <option value="4">Deep Purple</option>
                <option value="5">Monochrome</option>
                <option value="6">Orbit Trap</option>
            </select>
        </div>

        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="chk-julia">
                <span>Switch to Julia Set</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="chk-animate" checked>
                <span>Cycle Palette Colors</span>
            </label>
        </div>

        <div class="control-group" style="margin-top: 10px;">
            <button id="btn-reset">Reset View</button>
        </div>

        <div class="stats">
            <div>Zoom: <span id="stat-zoom">1.0x</span></div>
            <div>Re: <span id="stat-x">-0.70000000</span></div>
            <div>Im: <span id="stat-y">0.00000000</span></div>
            <div>FPS: <span id="stat-fps">60</span></div>
        </div>

        <div class="hint">
            <strong>Controls:</strong><br>
            - Scroll mouse wheel to zoom (zooms to cursor)<br>
            - Click &amp; drag to pan around<br>
            - Space to pause color cycling<br>
            - Press J to toggle Julia set
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
